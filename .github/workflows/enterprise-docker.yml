name: Enterprise Docker image

# Builds the single vikunja-enterprise image for amd64 and arm64 and pushes it
# to ghcr.io/<owner>/vikunja-enterprise.
#   push to main  -> :main and :sha-<short>
#   tag  e*       -> :<tag> and :latest
on:
  push:
    branches: [main]
    tags: ['e*']
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

concurrency:
  group: enterprise-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    if: ${{ github.repository_owner == 'bahadirdogru' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Version
        id: version
        run: |
          echo "describe=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          image="ghcr.io/${{ github.repository_owner }}/vikunja-enterprise"
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=${image}:${{ github.ref_name }},${image}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${image}:main,${image}:sha-${{ steps.version.outputs.short }}" >> "$GITHUB_OUTPUT"
          fi
      # The Dockerfile cross-compiles on the build platform (xgo), so no QEMU
      # emulation is needed for the arm64 image.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            RELEASE_VERSION=${{ steps.version.outputs.describe }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
